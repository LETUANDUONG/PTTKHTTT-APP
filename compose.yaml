name: hoodoo
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hoodoo}
      POSTGRES_USER: ${POSTGRES_USER:-hoodoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 10
  app:
    image: hoodoo-app
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-hoodoo}
      PGUSER: ${POSTGRES_USER:-hoodoo}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./models:/app/models:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:5000"
volumes:
  postgres_data:
